name: Build My Workouts V4 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            for candidate in /usr/local/lib/android/sdk /opt/android-sdk; do
              if [ -d "$candidate" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK was not found on this GitHub runner." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            while IFS= read -r candidate; do
              SDKMANAGER="$candidate"
            done < <(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -path '*/bin/sdkmanager' 2>/dev/null | sort -V)
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "No usable sdkmanager was found under $SDK_ROOT/cmdline-tools." >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Validate V4 source package
        run: node scripts/validate-source.js

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Add browser Excel library
        run: cp node_modules/xlsx/dist/xlsx.full.min.js www/xlsx.full.min.js

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Install V4 native overrides and permissions
        shell: bash
        run: |
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          JAVA_DIR="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$JAVA_DIR"
          cp android-overrides/*.java "$JAVA_DIR/"
          sed -i "s/APP_PACKAGE/$APP_ID/g" "$JAVA_DIR"/*.java
          python3 patch_manifest.py

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Workouts-V4-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
